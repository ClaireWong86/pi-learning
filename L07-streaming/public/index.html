<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DataAgent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light;
        --bg: #faf9f5;
        --side: #f0eee6;
        --ink: #141413;
        --muted: #6e6c64;
        --line: #e8e6dc;
        --accent: #d97757;
        --chip: #e8e6dc;
        --danger: #8d2b2b;
        --claude-sans: "Poppins", "PingFang SC", "Noto Sans SC", Arial, sans-serif;
        --claude-serif: "Lora", "Songti SC", "Noto Serif SC", Georgia, serif;
        --mono: ui-monospace, "Courier New", monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        font: 16px/1.65 var(--claude-serif);
        -webkit-font-smoothing: antialiased;
        color: var(--ink);
        background: var(--bg);
      }
      .app { display: grid; grid-template-columns: 248px minmax(0, 1fr); height: 100vh; }
      .side {
        background: var(--side);
        padding: 22px 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-height: 0;
        font-family: var(--claude-sans);
      }
      .brand { display: flex; align-items: center; gap: 8px; padding: 0 4px; }
      .brand svg { flex: none; }
      .brand strong { font-family: var(--claude-sans); font-size: 18px; font-weight: 600; letter-spacing: -0.03em; }
      .harness {
        background: #141413;
        color: #faf9f5;
        border-radius: 6px;
        padding: 2px 6px;
        font: 700 10px/1.4 var(--claude-sans);
        letter-spacing: 0.06em;
      }
      #new-chat {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        border: 0;
        border-radius: 12px;
        background: var(--bg);
        border: 1px solid var(--line);
        padding: 12px 14px;
        color: var(--ink);
        font: 500 15px/1 var(--claude-sans);
        cursor: pointer;
      }
      #new-chat:disabled { opacity: 0.55; cursor: wait; }
      .field { display: flex; flex-direction: column; gap: 6px; color: var(--muted); font-size: 12px; }
      select {
        border: 0;
        border-radius: 10px;
        background: var(--bg);
        padding: 10px 12px;
        font: 15px/1.4 var(--claude-sans);
        color: var(--ink);
      }
      #health { margin-top: auto; color: var(--muted); font-size: 12px; line-height: 1.45; }
      .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
      .tabs {
        display: flex;
        gap: 28px;
        padding: 0 28px;
        border-bottom: 1px solid var(--line);
      }
      .tabs button {
        position: relative;
        border: 0;
        background: transparent;
        padding: 16px 0 12px;
        color: var(--muted);
        font: 600 15px/1 var(--claude-sans);
        cursor: pointer;
      }
      .tabs button[aria-selected="true"] { color: var(--ink); }
      .tabs button[aria-selected="true"]::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -1px;
        height: 2px;
        background: var(--accent);
      }
      .count[hidden] { display: none; }
      .count {
        display: inline-block;
        min-width: 16px;
        margin-left: 6px;
        padding: 0 5px;
        border-radius: 99px;
        background: #f3e6df;
        color: var(--accent);
        font-size: 11px;
        line-height: 16px;
        vertical-align: 1px;
      }
      .panel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      .panel[hidden] { display: none; }
      #log {
        flex: 1;
        overflow: auto;
        padding: 28px 28px 12px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        font-family: var(--claude-serif);
      }
      .bubble { max-width: min(720px, 86%); white-space: pre-wrap; }
      .bubble.user {
        align-self: flex-end;
        background: var(--chip);
        border-radius: 16px;
        padding: 10px 14px;
      }
      .bubble.assistant { align-self: flex-start; }
      .tool-chip, .meta, .pending {
        align-self: flex-start;
        color: var(--muted);
        font-family: var(--claude-sans);
        font-size: 13px;
      }
      .tool-chip {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px 10px;
        background: white;
      }
      .error { color: var(--danger); white-space: pre-wrap; }
      .composer { padding: 8px 28px 20px; }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
      .chip {
        border: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        border-radius: 999px;
        padding: 6px 10px;
        font: 500 13px/1.2 var(--claude-sans);
        cursor: pointer;
      }
      form { display: flex; gap: 8px; }
      input {
        flex: 1;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
        font: 15px/1.4 var(--claude-sans);
        background: white;
      }
      #send {
        border: 0;
        border-radius: 14px;
        padding: 0 18px;
        background: var(--accent);
        color: #faf9f5;
        font: 600 15px/1 var(--claude-sans);
        cursor: pointer;
      }
      #send:disabled, .chip:disabled { opacity: 0.55; cursor: wait; }
      #trace {
        flex: 1;
        overflow: auto;
        padding: 28px;
      }
      #trace .empty { color: var(--muted); margin: 48px 0; }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 18px;
      }
      .stat {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
      }
      .stat span { display: block; color: var(--muted); font-size: 12px; }
      .stat b { display: block; margin-top: 4px; font-weight: 600; word-break: break-word; }
      .step { border-top: 1px solid var(--line); padding: 12px 0; }
      .step pre, .call pre {
        white-space: pre-wrap;
        margin: 8px 0 0;
        font: 12px/1.45 var(--mono);
        color: #334;
      }
      #tab-trace[data-hot="1"] { color: var(--accent); }
      .round-title { margin: 8px 0 12px; font-size: 15px; font-weight: 600; }
      .round + .round { margin-top: 22px; padding-top: 8px; border-top: 1px solid var(--line); }
      .call { border-top: 1px solid var(--line); padding: 12px 0; }
      .call .meta { color: var(--muted); font-size: 12px; margin-top: 8px; }
      .call .status.ok { color: #0a7a4a; }
      .call .status.blocked { color: #a15c07; }
      .call .status.error, .call .status.running { color: #a33; }
      @media (max-width: 800px) {
        .app { grid-template-columns: 1fr; height: auto; min-height: 100vh; }
        .side { min-height: auto; }
        #health { margin-top: 0; }
        .stats { grid-template-columns: 1fr 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="side">
        <div class="brand">
          <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
            <rect width="28" height="28" rx="8" fill="#d97757" />
            <path d="M7 18.5c2.2-1.2 3.4-4.2 4.2-6.2.6 2.4 1.8 5 4.3 6.2 2.2-1.6 3.4-4.4 3.8-6.8.2 2.2 1.2 4.6 3.2 6.2" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" />
          </svg>
          <strong>DataAgent</strong>
          <span class="harness">HARNESS</span>
        </div>
        <button id="new-chat" type="button">＋ 新会话</button>
        <label class="field">
          当前用户
          <select id="user" name="userId">
            <option value="u002">李先生 · 全部地区</option>
            <option value="u001">王小姐 · 仅华东</option>
          </select>
        </label>
        <p id="health">正在连接只读销售库…</p>
      </aside>
      <section class="main">
        <div class="tabs" role="tablist">
          <button id="tab-chat" type="button" role="tab" aria-selected="true" aria-controls="panel-chat">对话</button>
          <button id="tab-trace" type="button" role="tab" aria-selected="false" aria-controls="panel-trace">轨迹<span id="trace-count" class="count" hidden>0</span></button>
        </div>
        <div id="panel-chat" class="panel" role="tabpanel">
          <div id="log"></div>
          <div class="composer">
            <div class="chips">
              <button class="chip" type="button" data-user="u002" data-q="2026年3月销售额最低的地区是哪里？这个地区相比去年3月，同比是多少？先找出地区，再查同比。">多轮同比</button>
              <button class="chip" type="button" data-user="u002" data-q="2026年1月哪个产品销售额最高？只看这个产品，华东和华南各卖了多少？">先排名再拆分</button>
              <button class="chip" type="button" data-user="u002" data-q="2026年1月华东笔记本的销售额是多少？">单次查询</button>
              <button class="chip" type="button" data-user="u001" data-q="2026年1月华南笔记本销售额是多少？">越权查询</button>
            </div>
            <form id="form">
              <input id="message" name="message" value="2026年1月华东笔记本的销售额是多少？" autocomplete="off" />
              <button id="send" type="submit">发送</button>
            </form>
          </div>
        </div>
        <div id="panel-trace" class="panel" role="tabpanel" hidden>
          <div id="trace">
            <p id="rail-empty" class="empty">发送问题后，这里按调用留下轮次、提交参数、放行后的条件、结果和依赖。</p>
            <div id="rail-body" hidden></div>
          </div>
        </div>
      </section>
    </div>
    <script>
      const log = document.querySelector("#log");
      const form = document.querySelector("#form");
      const input = document.querySelector("#message");
      const userSelect = document.querySelector("#user");
      const send = document.querySelector("#send");
      const newChat = document.querySelector("#new-chat");
      const railEmpty = document.querySelector("#rail-empty");
      const railBody = document.querySelector("#rail-body");
      const health = document.querySelector("#health");
      const tabChat = document.querySelector("#tab-chat");
      const tabTrace = document.querySelector("#tab-trace");
      const panelChat = document.querySelector("#panel-chat");
      const panelTrace = document.querySelector("#panel-trace");
      const traceCount = document.querySelector("#trace-count");
      const tools = new Map();
      let answer = null;
      let thinkingPre = null;
      let timer = null;
      let traceStarted = 0;
      let activeUser = userSelect.value;
      let freshNext = false;
      let threadId = null;
      let liveCalls = [];
      let currentTurn = 1;
      const railEmptyText = "发送问题后，这里按调用留下轮次、提交参数、放行后的条件、结果和依赖。";

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text != null) node.textContent = text;
        return node;
      }

      function showTab(name) {
        const chat = name === "chat";
        panelChat.hidden = !chat;
        panelTrace.hidden = chat;
        tabChat.setAttribute("aria-selected", String(chat));
        tabTrace.setAttribute("aria-selected", String(!chat));
      }

      tabChat.addEventListener("click", () => showTab("chat"));
      tabTrace.addEventListener("click", () => showTab("trace"));

      function add(node) {
        log.append(node);
        log.scrollTop = log.scrollHeight;
        return node;
      }

      function clearSurfaces(note) {
        clearInterval(timer);
        timer = null;
        log.replaceChildren();
        tools.clear();
        answer = null;
        thinkingPre = null;
        railBody.replaceChildren();
        railBody.hidden = true;
        railEmpty.hidden = false;
        railEmpty.textContent = note ? note + railEmptyText : railEmptyText;
        traceCount.hidden = true;
        traceCount.textContent = "0";
        tabTrace.removeAttribute("data-hot");
        threadId = null;
        liveCalls = [];
        freshNext = true;
        if (note) add(el("div", "meta", note));
      }

      function clearConversation() {
        const who = userSelect.selectedOptions[0].text;
        clearSurfaces(`当前是${who}。上一个人的结论已从屏幕上清掉。`);
        showTab("chat");
      }

      userSelect.addEventListener("change", () => {
        if (send.disabled) {
          userSelect.value = activeUser;
          return;
        }
        if (userSelect.value === activeUser) return;
        activeUser = userSelect.value;
        clearConversation();
      });

      newChat.addEventListener("click", () => {
        if (send.disabled) return;
        clearSurfaces("新会话。");
        showTab("chat");
        input.focus();
      });

      function setStat(label, value) {
        const row = railBody.querySelector(".round:last-child")?.querySelector(`.stat[data-label="${label}"]`);
        if (row) row.querySelector("b").textContent = value;
      }

      function setTraceCount() {
        const count = railBody.querySelectorAll(".call").length;
        traceCount.hidden = count < 1;
        traceCount.textContent = String(count);
      }

      function renderCalls() {
        const box = railBody.querySelector(".round:last-child .calls");
        if (!box) return;
        box.replaceChildren();
        for (const call of liveCalls) {
          const outcome = call.outcome || "running";
          const status = outcome === "ok" ? "返回" : outcome === "blocked" ? "拦住" : outcome === "error" ? "未执行" : "进行中";
          const block = el("div", `call ${outcome}`);
          const head = el("div", null, `第 ${call.turnIndex || currentTurn} 轮 · ${call.name || "query_data"} · `);
          head.append(el("span", `status ${outcome}`, status));
          block.append(head);
          block.append(el("div", "meta", "提交参数"));
          block.append(el("pre", null, JSON.stringify(call.args ?? {}, null, 2)));
          if (call.effective) {
            block.append(el("div", "meta", "放行后"));
            block.append(el("pre", null, JSON.stringify(call.effective, null, 2)));
          }
          for (const link of call.dependsOn || []) {
            const at = liveCalls.findIndex((item) => item.id === link.callId);
            block.append(el("div", "meta", `依赖第 ${at + 1} 次调用的${link.take === "max" ? "最大组" : "极值"}「${link.value}」`));
          }
          if (call.extremum?.key) block.append(el("div", "meta", `极值：${call.extremum.key}`));
          if (call.resultPreview) block.append(el("pre", null, call.resultPreview));
          box.append(block);
        }
        setTraceCount();
      }

      function appendRound(event) {
        railBody.hidden = false;
        railEmpty.hidden = true;
        liveCalls = [];
        currentTurn = 1;
        const section = el("section", "round");
        section.append(el("h3", "round-title", event.input || "这一问"));
        const stats = el("div", "stats");
        for (const label of ["模型", "用户", "时长", "轮次", "工具调用"]) {
          const row = el("div", "stat");
          row.append(el("span", null, label), el("b", null, "—"));
          row.dataset.label = label;
          stats.append(row);
        }
        section.append(stats, el("div", "calls"));
        railBody.append(section);
        const user = event.user || {};
        setStat("模型", event.model || "—");
        setStat("用户", user.name ? `${user.name} · ${user.scope || ""}` : "—");
        setStat("时长", "0.0 秒");
        setStat("轮次", "0");
        setStat("工具调用", "0");
      }

      function handle(event) {
        if (event.type === "trace_start") {
          if (event.threadId) threadId = event.threadId;
          appendRound(event);
          traceStarted = Date.now();
          clearInterval(timer);
          timer = setInterval(() => setStat("时长", `${((Date.now() - traceStarted) / 1000).toFixed(1)} 秒`), 200);
        } else if (event.type === "turn") {
          if (event.phase === "start") {
            currentTurn = event.index;
            setStat("轮次", String(event.index));
          }
        } else if (event.type === "text") {
          if (!answer) answer = add(el("div", "bubble assistant"));
          answer.textContent += event.delta;
          log.scrollTop = log.scrollHeight;
        } else if (event.type === "tool_start") {
          const chip = add(el("div", "tool-chip", `${event.name} · 查询中`));
          tools.set(event.id, chip);
          liveCalls.push({
            id: event.id,
            name: event.name,
            args: event.args,
            turnIndex: event.turnIndex || currentTurn,
            outcome: "running",
          });
          setStat("工具调用", String(liveCalls.length));
          renderCalls();
        } else if (event.type === "tool_end") {
          const call = liveCalls.find((item) => item.id === event.id);
          if (call && call.outcome !== "blocked") {
            const text = event.result || "";
            const failed = event.isError || text.startsWith("已拦截") || text.startsWith("无法查询");
            call.outcome = failed ? "error" : "ok";
            call.resultPreview = text.split("\n").find((line) => line.startsWith("结果：") || line.startsWith("已拦截") || line.startsWith("无法查询")) || "";
          }
          renderCalls();
          const chip = tools.get(event.id);
          if (!chip || chip.dataset.done === "1") return;
          chip.dataset.done = "1";
          const cost = event.durationMs != null ? ` · ${event.durationMs} ms` : "";
          chip.textContent = event.isError ? `${event.name} 未执行${cost}` : `${event.name} 完成${cost}`;
        } else if (event.type === "guard") {
          const call = liveCalls.find((item) => item.id === event.id);
          if (!call) return;
          if (event.blocked) {
            call.outcome = "blocked";
            call.resultPreview = event.reason || "";
          } else if (event.effective) {
            call.effective = event.effective;
          }
          renderCalls();
        } else if (event.type === "trace_end") {
          clearInterval(timer);
          liveCalls = event.calls || liveCalls;
          renderCalls();
          setStat("时长", `${(event.durationMs / 1000).toFixed(1)} 秒`);
          setStat("轮次", String((event.turns || []).length));
          setStat("工具调用", String(liveCalls.length));
          const multi = liveCalls.filter((call) => call.outcome === "ok").length > 1 || liveCalls.some((call) => call.dependsOn && call.dependsOn.length);
          if (multi) tabTrace.dataset.hot = "1";
        } else if (event.type === "error") {
          add(el("div", "error", event.message));
        }
      }

      async function loadHealth() {
        const res = await fetch("/api/health");
        const body = await res.json();
        health.textContent = `${body.model} · 只读 ${body.source} · ${body.rows} 行 · ${body.dbFrom} ~ ${body.dbTo}`;
      }
      loadHealth().catch(() => {
        health.textContent = "只读库还没连上";
      });

      for (const chip of document.querySelectorAll(".chip")) {
        chip.addEventListener("click", () => {
          if (send.disabled) return;
          input.value = chip.dataset.q;
          if (chip.dataset.user !== userSelect.value) {
            userSelect.value = chip.dataset.user;
            userSelect.dispatchEvent(new Event("change"));
          }
          input.focus();
        });
      }

      const IDLE_TIMEOUT_MS = 45000;

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const message = input.value.trim();
        if (!message) return;
        answer = null;
        showTab("chat");
        const mine = add(el("div", "bubble user", message));
        mine.textContent = message;
        const startFresh = freshNext;
        freshNext = false;
        send.disabled = true;
        newChat.disabled = true;

        const controller = new AbortController();
        let idleTimer = null;
        let timedOut = false;
        const armIdle = () => {
          clearTimeout(idleTimer);
          idleTimer = setTimeout(() => {
            timedOut = true;
            controller.abort();
          }, IDLE_TIMEOUT_MS);
        };
        armIdle();

        try {
          const res = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message, userId: userSelect.value, fresh: startFresh, threadId: startFresh ? undefined : threadId || undefined }),
            signal: controller.signal,
          });
          if (!res.ok || !res.body) {
            const body = await res.json().catch(() => ({ error: res.statusText }));
            handle({ type: "error", message: body.error || "请求失败" });
            return;
          }
          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";
          while (true) {
            const chunk = await reader.read();
            if (chunk.done) break;
            armIdle();
            buffer += decoder.decode(chunk.value, { stream: true });
            const parts = buffer.split("\n\n");
            buffer = parts.pop() ?? "";
            for (const part of parts) {
              const line = part.split("\n").find((item) => item.startsWith("data: "));
              if (!line) continue;
              handle(JSON.parse(line.slice(6)));
            }
          }
        } catch (error) {
          handle({
            type: "error",
            message: timedOut ? "45 秒没收到任何数据，连接已中断。请重新发送。" : error.message,
          });
        } finally {
          clearTimeout(idleTimer);
          clearInterval(timer);
          send.disabled = false;
          newChat.disabled = false;
          input.focus();
        }
      });
    </script>
  </body>
</html>
